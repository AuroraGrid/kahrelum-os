name: Build KAHRELUM Forecast Social Preview v2

on:
  push:
    branches:
      - fix/forecast-social-preview-v2-20261112
    paths:
      - '.github/workflows/forecast-social-v2-build.yml'
      - 'assets/social/og-100-forecast-challenge-v2.svg'
      - 'scripts/build-forecast-social-v2.py'

permissions:
  contents: write

concurrency:
  group: forecast-social-v2-artifact
  cancel-in-progress: false

jobs:
  compile-and-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout the exact social-preview source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Install pinned rasterizer
        run: python3 -m pip install --disable-pip-version-check --quiet cairosvg==2.8.2
      - name: Render and verify Latin-letter social card
        run: |
          python3 scripts/build-forecast-social-v2.py
          python3 scripts/build-forecast-social-v2.py --check
      - name: Commit only the generated PNG
        shell: bash
        run: |
          set -euo pipefail
          git add -- assets/social/og-100-forecast-challenge-v2.png
          if git diff --cached --quiet; then
            echo "Already generated, no new commit required."
            exit 0
          fi
          git diff --cached --name-only | grep -Fx 'assets/social/og-100-forecast-challenge-v2.png'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(social): record exact English KAHRELUM forecast preview PNG'
          git push origin 'HEAD:refs/heads/fix/forecast-social-preview-v2-20261112'
